%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/hisilicon,hi3798cv200-aiao.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798CV200 AIAO controller

maintainers:
  - linux-sound@vger.kernel.org

description:
  The Audio Input/Audio Output controller contains serial audio interfaces and
  native circular DMA buffers. A selected transmit interface is exposed as a
  standard ASoC DAI. Board routing selects the transmit channel; TX0 is the
  default. The channel selects its DMA bank, clock source and IRQ.
  The PCM DMA path accepts signed 16-bit samples or 24 significant bits in
  the most significant bits of a 32-bit word (ALSA S32_LE with msbits 24).
  Low-justified S24_LE is not a native DMA format.
  CV200 uses the 933.888 MHz audio PLL, while MV310 uses the BSP's
  860.160 MHz source and has a different internal HDMI transmit port.

properties:
  compatible:
    enum:
      - hisilicon,hi3798cv200-aiao
      - hisilicon,hi3798mv310-aiao

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: AIAO working clock
      - description: Audio master PLL clock
  clock-names:
    items:
      - const: bus
      - const: mclk
  resets:
    maxItems: 1

  "#sound-dai-cells":
    const: 1
    description: |
      DAI 0 is the board-selected analog/external I2S port. DAI 1 is the
      internal HDMI port (TX3 on CV200, TX2 on MV310). The two PCM devices
      share the driver's DMA state and cannot be opened simultaneously.

  hisilicon,tx-channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 3
    default: 0
    description: Analog/external I2S transmit port index (DAI 0 only).

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - "#sound-dai-cells"

allOf:
  - $ref: dai-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/histb-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    audio-controller@f8cd0000 {
        compatible = "hisilicon,hi3798cv200-aiao";
        reg = <0xf8cd0000 0x10000>;
        interrupts = <GIC_SPI 84 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crg HISTB_AIAO_CLK>, <&crg HISTB_AIAO_MCLK>;
        clock-names = "bus", "mclk";
        resets = <&crg 0x118 4>;
        #sound-dai-cells = <1>;
    };
...
