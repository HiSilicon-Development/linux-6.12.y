%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/hisilicon,hi3798cv200-tianlai-codec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798CV200 Tianlai internal DAC

maintainers:
  - linux-sound@vger.kernel.org

description:
  The Tianlai block is the stereo digital-to-analog converter integrated in
  the Hi3798CV200 peripheral controller.

properties:
  compatible:
    const: hisilicon,hi3798cv200-tianlai-codec

  reg:
    items:
      - description: Digital DAC control register
      - description: Serial data and pop control register
      - description: Analog DAC control register

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  mute-gpios:
    maxItems: 1
    description: Optional external analog output mute control

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - resets
  - "#sound-dai-cells"

allOf:
  - $ref: dai-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/histb-clock.h>
    #include <dt-bindings/gpio/gpio.h>

    audio-codec@110 {
        compatible = "hisilicon,hi3798cv200-tianlai-codec";
        reg = <0x110 0x4>, <0x114 0x4>, <0x160 0x4>;
        clocks = <&crg HISTB_ADAC_CLK>;
        resets = <&crg 0x114 4>;
        mute-gpios = <&gpio9 0 GPIO_ACTIVE_LOW>;
        #sound-dai-cells = <0>;
    };
...
