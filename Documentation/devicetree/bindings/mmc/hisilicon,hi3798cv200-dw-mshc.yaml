%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/hisilicon,hi3798cv200-dw-mshc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon HiSTB SoCs specific extensions to the Synopsys DWMMC controller

maintainers:
  - Yang Xiwen <forbidden405@outlook.com>

properties:
  compatible:
    enum:
      - hisilicon,hi3798cv200-dw-mshc
      - hisilicon,hi3798mv200-dw-mshc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: bus interface unit clock
      - description: card interface unit clock
      - description: card input sample phase clock
      - description: controller output drive phase clock

  clock-names:
    items:
      - const: ciu
      - const: biu
      - const: ciu-sample
      - const: ciu-drive

  hisilicon,sap-dll-reg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: |
      DWMMC core on Hi3798MV2x SoCs has a delay-locked-loop(DLL) attached to card data input path.
      It is integrated into CRG core on the SoC and has to be controlled during tuning.
    items:
      - description: A phandle pointed to the CRG syscon node
      - description: Sample DLL register offset in CRG address space

  hisilicon,io-voltage-reg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: |
      A phandle to the system controller and the register offset whose bit 0
      reports the eMMC I/O voltage selected by the board. A set bit reports
      1.8 V and a clear bit reports 3.3 V. The driver uses the read-only value
      to select the captured DDR52 sample phase; it never changes the voltage.
    items:
      - items:
          - description: A phandle to the system controller syscon node
          - description: I/O voltage status register offset

  hisilicon,hs400-strobe-reg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: |
      CRG syscon register containing the CV200 HS400 data-strobe enable
      bit and delay field. The driver either inherits a bootloader-qualified
      delay or tunes phases 1 through 15 with repeated EXT_CSD reads.
    items:
      - items:
          - description: A phandle to the CRG syscon node
          - description: HS400 data-strobe register offset

  hisilicon,inherit-boot-tuning:
    type: boolean
    description: |
      Preserve the HS200 sample phase and HS400 data-strobe delay qualified by
      the bootloader when they are usable. The driver captures both values
      before its first timing transition and validates the sample phase with
      CMD21. A stale or invalid hand-off is not fatal: Linux disables
      inheritance and actively retunes the sample and data-strobe windows.
      Validated values are restored whenever the card returns to HS400.

dependencies:
  hisilicon,inherit-boot-tuning:
    - hisilicon,hs400-strobe-reg
    - hisilicon,io-voltage-reg

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

allOf:
  - $ref: synopsys-dw-mshc-common.yaml#

  - if:
      properties:
        compatible:
          contains:
            const: hisilicon,hi3798mv200-dw-mshc
    then:
      required:
        - hisilicon,sap-dll-reg
      properties:
        hisilicon,io-voltage-reg: false
        hisilicon,hs400-strobe-reg: false
        hisilicon,inherit-boot-tuning: false
    else:
      properties:
        hisilicon,sap-dll-reg: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/histb-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mmc@9830000 {
        compatible = "hisilicon,hi3798cv200-dw-mshc";
        reg = <0x9830000 0x10000>;
        interrupts = <GIC_SPI 35 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crg HISTB_MMC_CIU_CLK>,
                 <&crg HISTB_MMC_BIU_CLK>,
                 <&crg HISTB_MMC_SAMPLE_CLK>,
                 <&crg HISTB_MMC_DRV_CLK>;
        clock-names = "ciu", "biu", "ciu-sample", "ciu-drive";
        resets = <&crg 0xa0 4>;
        reset-names = "reset";
        hisilicon,io-voltage-reg = <&sysctrl 0xf4>;
        hisilicon,hs400-strobe-reg = <&crg 0x290>;
        hisilicon,inherit-boot-tuning;
        pinctrl-names = "default", "hs200", "hs400";
        pinctrl-0 = <&emmc_pins_1>;
        pinctrl-1 = <&emmc_hs200_pins>;
        pinctrl-2 = <&emmc_hs400_pins>;
        fifo-depth = <256>;
        clock-frequency = <150000000>;
        max-frequency = <150000000>;
        cap-mmc-highspeed;
        mmc-ddr-1_8v;
        mmc-hs200-1_8v;
        mmc-hs400-1_8v;
        non-removable;
        bus-width = <8>;
    };
