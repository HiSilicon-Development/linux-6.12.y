%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/hisilicon,hi3798mv310-otp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV310 calibration OTP

maintainers:
  - HiSilicon <linux@hisilicon.com>

description: |
  Read-only access to the temperature calibration word at OTP address 0x258
  and CPU voltage trim bytes at 0x44c and 0x44e. The provider serializes read
  transactions and restores controller state. OTP programming, device
  identifiers and key material are not exposed.

allOf:
  - $ref: nvmem.yaml#

properties:
  compatible:
    const: hisilicon,hi3798mv310-otp
  reg:
    maxItems: 1
  '#address-cells':
    const: 1
  '#size-cells':
    const: 1

  temperature@258:
    type: object
    properties:
      reg:
        maxItems: 1
    required:
      - reg
    additionalProperties: false


  cpu-1200m@44c:
    type: object
    properties:
      reg:
        maxItems: 1
    required:
      - reg
    additionalProperties: false

  cpu-800m@44e:
    type: object
    properties:
      reg:
        maxItems: 1
    required:
      - reg
    additionalProperties: false
required:
  - compatible
  - reg
  - '#address-cells'
  - '#size-cells'

unevaluatedProperties: false
