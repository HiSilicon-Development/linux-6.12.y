%YAML 1.2
---
$id: http://devicetree.org/schemas/media/hisilicon,hi3798cv200-vdec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon HiSTB video decoders

maintainers:
  - linux-media@vger.kernel.org

description:
  Hi3798CV200 and Hi3798MV310 contain video decoding, stream code detection,
  bit-plane decoding and local memory management engines with distinct
  register and message protocols. MV310 uses internal wrapper resets and
  a CRG mux, not the CV200 VDH/DSP/BPD gates and external reset bits.
  Reconstruction and firmware storage use a dedicated DMA pool; CV200 uses
  a non-reusable pool, while MV310 can use a reusable CMA pool.
  Capture storage uses a separate reusable CMA pool within the device DMA
  aperture, so native UHD output does not exhaust display scanout memory.
  Capture DMA-BUFs retain this allocation context until their final release.

properties:
  compatible:
    enum:
      - hisilicon,hi3798cv200-vdec
      - hisilicon,hi3798mv310-vdec

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: Video decoding hardware interrupt
      - description: Stream code detector interrupt
      - description: Decoder memory management unit interrupt

  interrupt-names:
    items:
      - const: vdh
      - const: scd
      - const: mmu

  clocks:
    items:
      - description: Video decoding hardware clock
      - description: Video decoder DSP clock
      - description: Bit-plane decoder clock

  clock-names:
    items:
      - const: vdh
      - const: dsp
      - const: bpd

  resets:
    items:
      - description: Video decoding hardware reset
      - description: Stream code detector reset
      - description: Main format decoding engine reset
      - description: Bit-plane decoder reset

  reset-names:
    items:
      - const: vdh
      - const: scd
      - const: mfd
      - const: bpd

  hisilicon,vpss:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Video post-processing engine used for tile-to-linear output

  hisilicon,crg-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: MV310 CRG syscon containing the VDH mux at offset 0x78

  memory-region:
    items:
      - description: Dedicated DMA pool for reconstruction and firmware buffers
      - description: Reusable CMA pool for cacheable, contiguous capture buffers

  memory-region-names:
    items:
      - const: reconstruction
      - const: capture

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - hisilicon,vpss
  - memory-region
  - memory-region-names

allOf:
  - if:
      properties:
        compatible:
          const: hisilicon,hi3798mv310-vdec
    then:
      properties:
        clocks: false
        clock-names: false
        resets: false
        reset-names: false
      required:
        - hisilicon,crg-syscon
    else:
      properties:
        hisilicon,crg-syscon: false
      required:
        - clocks
        - clock-names
        - resets
        - reset-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/histb-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    video-codec@f8c30000 {
        compatible = "hisilicon,hi3798cv200-vdec";
        reg = <0xf8c30000 0x10000>;
        interrupts = <GIC_SPI 95 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 104 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 149 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "vdh", "scd", "mmu";
        clocks = <&crg HISTB_VDH_CLK>,
                 <&crg HISTB_VDH_DSP_CLK>,
                 <&crg HISTB_BPD_CLK>;
        clock-names = "vdh", "dsp", "bpd";
        resets = <&crg 0x78 4>, <&crg 0x78 5>,
                 <&crg 0x78 6>, <&crg 0x88 4>;
        reset-names = "vdh", "scd", "mfd", "bpd";
        hisilicon,vpss = <0x1>;
        memory-region = <&vdec_pool>, <&capture_cma>;
        memory-region-names = "reconstruction", "capture";
    };
