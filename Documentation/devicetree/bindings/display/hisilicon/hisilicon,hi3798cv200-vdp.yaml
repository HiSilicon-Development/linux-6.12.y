%YAML 1.2
---
$id: http://devicetree.org/schemas/display/hisilicon/hisilicon,hi3798cv200-vdp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798CV200 and Hi3798MV310 video display processors

maintainers:
  - dri-devel@lists.freedesktop.org

description:
  The Hi3798CV200 and Hi3798MV310 video display processors read graphics and
  video planes from memory, blend them, and generate SoC display timings.
  MV310 uses a separate graphics fetch engine and supports a primary linear
  RGB graphics plane up to 4096x2160 without scaling, with progressive
  display timings up to 594 MHz and 60 Hz. Its VOU reset is distinct from
  the pixel clock divider reset owned by the clock provider.
  CV200 routes G0, G1 and physical G3 through GP0, and V0/V1 through VP0.
  The final mixer orders these two groups; an independent VP1 is not used.

properties:
  compatible:
    enum:
      - hisilicon,hi3798cv200-vdp
      - hisilicon,hi3798mv310-vdp

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 4
    items:
      - description: Video output bus clock
      - description: Video output high-definition clock
      - description: Display processor configuration clock
      - description: Display processor high-definition core clock
      - description: Primary video plane clock
      - description: Primary graphics plane clock
      - description: Video output pixel bypass clock feeding the HDMI interface
      - description: Second HD graphics fetch clock (physical G1)
      - description: Third HD graphics fetch clock (physical G3)
      - description: Secondary video fetch clock (V1)
  clock-names:
    minItems: 4
    items:
      - const: bus
      - const: hd
      - const: config
      - const: core
      - const: video
      - const: graphics
      - const: bp
      - const: graphics1
      - const: graphics3
      - const: video1
  resets:
    maxItems: 1

  reset-names:
    const: vdp

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Primary high-definition display output

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: Secondary display output

    required:
      - port@0

    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - ports

allOf:
  - if:
      properties:
        compatible:
          const: hisilicon,hi3798mv310-vdp
    then:
      properties:
        clocks:
          maxItems: 4
        clock-names:
          maxItems: 4
        ports:
          properties:
            port@1: false
    else:
      properties:
        clocks:
          minItems: 10
        clock-names:
          minItems: 10

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/histb-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    display-controller@f8cc0000 {
        compatible = "hisilicon,hi3798cv200-vdp";
        reg = <0xf8cc0000 0x10000>;
        interrupts = <GIC_SPI 90 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crg HISTB_VO_BUS_CLK>,
                 <&crg HISTB_VO_HD_CLK>,
                 <&crg HISTB_VDP_CFG_CLK>,
                 <&crg HISTB_VDP_HD_CLK>,
                 <&crg HISTB_VDP_V0_CLK>,
                 <&crg HISTB_VDP_G0_CLK>,
                 <&crg HISTB_VO_BP_CLK>,
                 <&crg HISTB_VDP_G1_CLK>,
                 <&crg HISTB_VDP_G3_CLK>,
                 <&crg HISTB_VDP_V1_CLK>;
        clock-names = "bus", "hd", "config", "core", "video", "graphics", "bp",
                      "graphics1", "graphics3", "video1";
        resets = <&crg 0xd8 30>;
        reset-names = "vdp";

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                vdp_hd0_out: endpoint {
                    remote-endpoint = <&hdmi_in>;
                };
            };
        };
    };

    hdmi-transmitter {
        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                hdmi_in: endpoint {
                    remote-endpoint = <&vdp_hd0_out>;
                };
            };
        };
    };
