%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/hisilicon,histb-rng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon STB True Random Number Generator

maintainers:
  - David Yang <mmyangfl@gmail.com>

properties:
  compatible:
    enum:
      - hisilicon,histb-rng
      - hisilicon,hi3798cv200-rng

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    rng@f8005200 {
        compatible = "hisilicon,hi3798cv200-rng";
        reg = <0xf8005200 0x10>;
    };
