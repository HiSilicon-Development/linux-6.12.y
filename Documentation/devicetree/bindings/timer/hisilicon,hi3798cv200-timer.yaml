%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/hisilicon,hi3798cv200-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798CV200 system timers

maintainers:
  - linux-kernel@vger.kernel.org

description: |
  The Hi3798CV200 provides five independent SP804-compatible 32-bit timer
  channels. One channel is used as a free-running system clocksource and the
  remaining four channels provide one clock event interrupt per CPU.

properties:
  compatible:
    const: hisilicon,hi3798cv200-timer

  reg:
    items:
      - description: Free-running clocksource channel
      - description: CPU0 clock event channel
      - description: CPU1 clock event channel
      - description: CPU2 clock event channel
      - description: CPU3 clock event channel

  reg-names:
    items:
      - const: clocksource
      - const: cpu0
      - const: cpu1
      - const: cpu2
      - const: cpu3

  interrupts:
    items:
      - description: CPU0 clock event interrupt
      - description: CPU1 clock event interrupt
      - description: CPU2 clock event interrupt
      - description: CPU3 clock event interrupt

  interrupt-names:
    items:
      - const: cpu0
      - const: cpu1
      - const: cpu2
      - const: cpu3

  clocks:
    maxItems: 1

  clock-names:
    const: timer

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    timer_clk: clock-24000000 {
        compatible = "fixed-clock";
        #clock-cells = <0>;
        clock-frequency = <24000000>;
    };

    timer@f8a29000 {
        compatible = "hisilicon,hi3798cv200-timer";
        reg = <0xf8a29000 0x20>,
              <0xf8a2a000 0x20>,
              <0xf8a2a020 0x20>,
              <0xf8a2b000 0x20>,
              <0xf8a2b020 0x20>;
        reg-names = "clocksource", "cpu0", "cpu1", "cpu2", "cpu3";
        interrupts = <GIC_SPI 26 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 59 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 27 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 60 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "cpu0", "cpu1", "cpu2", "cpu3";
        clocks = <&timer_clk>;
        clock-names = "timer";
    };
...
